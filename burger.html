<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apple-style menu</title>

  <style>
    :root {
      --header-height: 48px;
      --header-bg: rgba(250, 250, 252, 0.88);
      --text-color: #1d1d1f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--text-color);
      background: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Helvetica, Arial, sans-serif;
    }

    /* Hidden menu state control */
    .menu-toggle {
      position: fixed;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      height: var(--header-height);
      background: var(--header-bg);
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
    }

    .nav-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 980px;
      height: 100%;
      margin: 0 auto;
      padding: 0 18px;
    }

    .brand {
      color: var(--text-color);
      font-size: 18px;
      font-weight: 600;
      text-decoration: none;
    }

    /* Hamburger button */
    .menu-button {
      position: relative;
      z-index: 102;
      display: none;
      width: 44px;
      height: 44px;
      margin-right: -10px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .menu-button span {
      position: absolute;
      left: 12px;
      width: 20px;
      height: 1px;
      background: var(--text-color);
      border-radius: 1px;
      transition:
        top 0.25s ease 0.15s,
        transform 0.25s ease,
        opacity 0.2s ease;
    }

    .menu-button span:first-child {
      top: 18px;
    }

    .menu-button span:last-child {
      top: 25px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 32px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .nav-links a {
      color: var(--text-color);
      font-size: 12px;
      text-decoration: none;
    }

    .nav-links a:hover,
    .nav-links a:focus-visible {
      color: #06c;
    }

    .hero {
      display: grid;
      min-height: calc(100vh - var(--header-height));
      place-items: center;
      padding: 40px 20px;
      text-align: center;
    }

    .hero h1 {
      margin: 0 0 12px;
      font-size: clamp(42px, 8vw, 76px);
      letter-spacing: -0.05em;
    }

    .hero p {
      margin: 0;
      color: #6e6e73;
      font-size: 21px;
    }

    @media (max-width: 767px) {
      .menu-button {
        display: block;
      }

      .nav-links {
        position: fixed;
        inset: var(--header-height) 0 auto;
        z-index: 101;
        display: flex;
        align-items: flex-start;
        flex-direction: column;
        gap: 0;
        height: calc(100vh - var(--header-height));
        padding: 26px 40px 60px;
        overflow-y: auto;
        background: rgba(250, 250, 252, 0.98);
        visibility: hidden;
        opacity: 0;
        transform: translateY(-14px);
        transition:
          opacity 0.3s ease,
          transform 0.3s ease,
          visibility 0s linear 0.3s;
      }

      .nav-links li {
        width: 100%;
        opacity: 0;
        transform: translateY(-10px);
        transition:
          opacity 0.25s ease,
          transform 0.25s ease;
      }

      .nav-links a {
        display: block;
        padding: 11px 0;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      /* Open menu */
      .menu-toggle:checked ~ .site-header .nav-links {
        visibility: visible;
        opacity: 1;
        transform: translateY(0);
        transition-delay: 0s;
      }

      .menu-toggle:checked ~ .site-header .nav-links li {
        opacity: 1;
        transform: translateY(0);
      }

      .menu-toggle:checked ~ .site-header .nav-links li:nth-child(2) {
        transition-delay: 0.04s;
      }

      .menu-toggle:checked ~ .site-header .nav-links li:nth-child(3) {
        transition-delay: 0.08s;
      }

      .menu-toggle:checked ~ .site-header .nav-links li:nth-child(4) {
        transition-delay: 0.12s;
      }

      /* Turn the two lines into an X */
      .menu-toggle:checked ~ .site-header .menu-button span {
        top: 22px;
        transition:
          top 0.25s ease,
          transform 0.25s ease 0.15s;
      }

      .menu-toggle:checked
        ~ .site-header
        .menu-button
        span:first-child {
        transform: rotate(45deg);
      }

      .menu-toggle:checked
        ~ .site-header
        .menu-button
        span:last-child {
        transform: rotate(-45deg);
      }

      .menu-toggle:focus-visible ~ .site-header .menu-button {
        outline: 2px solid #0071e3;
        outline-offset: -4px;
        border-radius: 8px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .menu-button span,
      .nav-links,
      .nav-links li {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <input
    class="menu-toggle"
    id="menu-toggle"
    type="checkbox"
    aria-label="Open navigation menu"
  >

  <header class="site-header">
    <nav class="nav-bar" aria-label="Main navigation">
      <a class="brand" href="#">Logo</a>

      <ul class="nav-links">
        <li><a href="#">Store</a></li>
        <li><a href="#">Products</a></li>
        <li><a href="#">Support</a></li>
        <li><a href="#">Contact</a></li>
      </ul>

      <label class="menu-button" for="menu-toggle" aria-hidden="true">
        <span></span>
        <span></span>
      </label>
    </nav>
  </header>

  <main class="hero">
    <div>
      <h1>Minimal design.</h1>
      <p>Resize the browser to see the mobile menu.</p>
    </div>
  </main>
</body>
</html>
